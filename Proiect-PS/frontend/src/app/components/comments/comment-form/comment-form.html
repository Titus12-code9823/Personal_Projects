<form class="comment-form" (ngSubmit)="submit()">
  <h3>Adaugă comentariu</h3>

  @if (error) {
    <div class="state-box error">{{ error }}</div>
  }

  <label>
    Text
    <textarea [(ngModel)]="text" name="text" rows="4"></textarea>
  </label>

  <label>
    URL imagine
    <input [(ngModel)]="imageUrl" name="imageUrl" type="url" placeholder="https://..." />
  </label>

  <button type="submit" [disabled]="loading">
    {{ loading ? 'Se trimite...' : 'Adaugă comentariu' }}
  </button>
</form>
