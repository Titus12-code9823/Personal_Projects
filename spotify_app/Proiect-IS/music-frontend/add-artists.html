<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Artists via API</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 800px;
      margin: 50px auto;
      padding: 20px;
      background: #020617;
      color: #f8fafc;
    }
    .container {
      background: #1e293b;
      padding: 2rem;
      border-radius: 16px;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.3);
    }
    h1 {
      margin-top: 0;
    }
    .form-group {
      margin-bottom: 1rem;
    }
    label {
      display: block;
      margin-bottom: 0.5rem;
      color: #cbd5e1;
    }
    input {
      width: 100%;
      padding: 0.75rem;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #f8fafc;
      font-size: 1rem;
    }
    button {
      padding: 0.85rem 1.5rem;
      border-radius: 10px;
      border: none;
      background: #22c55e;
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 1rem;
      margin-right: 0.5rem;
    }
    button:hover {
      background: #16a34a;
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .btn-secondary {
      background: #64748b;
    }
    .btn-secondary:hover {
      background: #475569;
    }
    .result {
      margin-top: 1.5rem;
      padding: 1rem;
      border-radius: 8px;
      background: #0f172a;
      border: 1px solid #475569;
    }
    .success {
      color: #4ade80;
    }
    .error {
      color: #ef4444;
    }
    .info {
      color: #94a3b8;
      font-size: 0.9rem;
      margin-top: 1rem;
    }
    .artists-list {
      margin-top: 2rem;
      padding: 1rem;
      background: #0f172a;
      border-radius: 8px;
      border: 1px solid #475569;
    }
    .artist-item {
      padding: 0.75rem;
      margin-bottom: 0.5rem;
      background: #1e293b;
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .quick-add {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Add Artists via API</h1>
    <p class="info">Add artists to your database so you can create songs. Make sure backend is running on http://localhost:8080</p>
    
    <form id="artistForm">
      <div class="form-group">
        <label for="name">Artist Name *</label>
        <input type="text" id="name" name="name" required placeholder="e.g., The Weeknd">
      </div>
      
      <div class="form-group">
        <label for="genre">Genre (optional)</label>
        <input type="text" id="genre" name="genre" placeholder="e.g., Pop, Rock, Hip-Hop">
      </div>
      
      <button type="submit" id="submitBtn">Add Artist</button>
      <button type="button" id="loadArtistsBtn" class="btn-secondary">Load All Artists</button>
    </form>

    <div class="quick-add">
      <button type="button" id="quickAdd1" class="btn-secondary">Quick Add: The Weeknd (Pop)</button>
      <button type="button" id="quickAdd2" class="btn-secondary">Quick Add: Drake (Hip-Hop)</button>
    </div>
    
    <div id="result"></div>
    <div id="artistsList" class="artists-list" style="display: none;">
      <h3>All Artists in Database:</h3>
      <div id="artistsContainer"></div>
    </div>
  </div>

  <script>
    const API_BASE = 'http://localhost:8080';
    const TOKEN_KEY = 'token';

    const getToken = () => localStorage.getItem(TOKEN_KEY);

    const showResult = (message, isError = false) => {
      const resultDiv = document.getElementById('result');
      resultDiv.innerHTML = `
        <div class="result ${isError ? 'error' : 'success'}">
          <strong>${isError ? '❌' : '✅'}</strong>
          <p>${message}</p>
        </div>
      `;
    };

    const addArtist = async (name, genre = '') => {
      const token = getToken();
      if (!token) {
        showResult('You need to be logged in. Please login first using the login page.', true);
        return;
      }

      try {
        const response = await fetch(`${API_BASE}/api/v1/artists`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`,
          },
          body: JSON.stringify({ name, genre }),
        });

        if (!response.ok) {
          const errorData = await response.json().catch(() => ({ message: response.statusText }));
          throw new Error(errorData.message || `HTTP ${response.status}: ${response.statusText}`);
        }

        const data = await response.json();
        showResult(`Artist "${data.name}" added successfully! ID: ${data.id}`);
        document.getElementById('artistForm').reset();
        loadArtists();
      } catch (error) {
        showResult(error.message, true);
      }
    };

    const loadArtists = async () => {
      const token = getToken();
      if (!token) {
        return;
      }

      try {
        const response = await fetch(`${API_BASE}/api/v1/artists`, {
          headers: {
            'Authorization': `Bearer ${token}`,
          },
        });

        if (!response.ok) {
          throw new Error('Failed to load artists');
        }

        const artists = await response.json();
        const container = document.getElementById('artistsContainer');
        const listDiv = document.getElementById('artistsList');

        if (artists.length === 0) {
          container.innerHTML = '<p class="info">No artists in database yet.</p>';
        } else {
          container.innerHTML = artists.map(artist => `
            <div class="artist-item">
              <div>
                <strong>${artist.name}</strong>
                ${artist.genre ? `<span class="info"> - ${artist.genre}</span>` : ''}
                <br>
                <small class="info">ID: ${artist.id}</small>
              </div>
            </div>
          `).join('');
        }

        listDiv.style.display = 'block';
      } catch (error) {
        console.error('Failed to load artists:', error);
      }
    };

    document.getElementById('artistForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('name').value.trim();
      const genre = document.getElementById('genre').value.trim();
      
      if (!name) {
        showResult('Artist name is required.', true);
        return;
      }

      await addArtist(name, genre);
    });

    document.getElementById('loadArtistsBtn').addEventListener('click', loadArtists);

    document.getElementById('quickAdd1').addEventListener('click', () => {
      addArtist('The Weeknd', 'Pop');
    });

    document.getElementById('quickAdd2').addEventListener('click', () => {
      addArtist('Drake', 'Hip-Hop');
    });

    // Load artists on page load if token exists
    if (getToken()) {
      loadArtists();
    } else {
      document.getElementById('result').innerHTML = `
        <div class="result error">
          <strong>⚠️ Not logged in</strong>
          <p>You need to login first. Use the login page to get a token.</p>
        </div>
      `;
    }
  </script>
</body>
</html>
